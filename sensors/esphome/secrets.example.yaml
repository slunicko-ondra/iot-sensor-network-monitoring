# Copy this file to `secrets.yaml` on your ESPHome device build machine and fill in the values.

wifi_ssid: "<your-wifi-ssid>"
wifi_password: "<your-wifi-password>"

mqtt_username: "<mqtt-user>"
mqtt_password: "<mqtt-password>"

# Per-config ESPHome API keys (derived from the YAML filename stem).
# For example, for `temperature_single.yaml` the key is `temperature-single-key`.
blank-sensor-key: "<blank-sensor-key>"
