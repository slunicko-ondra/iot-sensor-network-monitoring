esphome:
  name: teplota-esp-01s
  friendly_name: Teplota ESP-01S

esp8266:
  board: esp01_1m

# Enable logging
logger:

api:
  encryption:
    key: "bpte9BjLSGz1OaSev66WBCWFdTUrqP7KFPNuJTbXpQI="
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "ff01b63bafaba183ee96100cfeae1486"

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "temperature-single Hotspot"
    password: "kProm2iSDJDm"

captive_portal:

mqtt:
  broker: 10.0.0.42
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  log_topic:
    topic: "esphome/teplota-esp-01s/debug"
    level: WARN

sensor:
  - platform: dht
    pin: 0
    temperature:
      id: "temp_sensor"
      name: "Temperature ESP-01S" # for Home Assistant
    humidity:
      id: "humidity_sensor"
      name: "Humidity ESP-01S" # for Home Assistant
    update_interval: 10s

interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: esphome/teplota-esp-01s/data
          payload: |-
            root["temperature"] = id(temp_sensor).state;
            root["humidity"] = id(humidity_sensor).state;
