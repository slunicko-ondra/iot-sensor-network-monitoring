substitutions:
  device_name: zigbee-rain

esphome:
  name: ${device_name}

esp32:
  variant: esp32c6
  partitions: partitions_zb.csv
  framework:
    type: esp-idf

# Enable logging
logger:

#api:
#  encryption:
#    key: !secret zigbee-rain-key
#  reboot_timeout: 0s
#
#ota:
#  - platform: esphome

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
#  manual_ip:
#    static_ip: 10.0.10.22
#    gateway: 10.0.10.1
#    subnet: 255.255.255.0

external_components:
  - source: github://luar123/zigbee_esphome
    components: [zigbee]

zigbee:
  id: zigbee_rain
  components: all
  on_join:
    then:
      - logger.log: "Joined network"

binary_sensor:
  - platform: gpio
    pin:
      number: 3
      inverted: true
    name: "Zigbee Rain Sensor"
    on_state:
      then:
        - zigbee.report: zigbee_rain
