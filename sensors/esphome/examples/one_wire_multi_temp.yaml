substitutions:
  device_name: multi-temperature-sensor
  wifi_fallback_name: "multi-temperature-sensor Hotspot"
  wifi_fallback_password: "kProm2iSDJDm"
  static_ip: 10.0.10.21
  gateway_ip: 10.0.10.1
  subnet: 255.255.255.0
  mqtt_broker: 10.0.10.12
  mqtt_topic_prefix: multi-temperature-sensor

esphome:
  name: ${device_name}

esp8266:
  board: esp01_1m

logger:

api:
  encryption:
    key: !secret one-wire-multi-temp-key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet}
  ap:
    ssid: ${wifi_fallback_name}
    password: ${wifi_fallback_password}

ota:
  - platform: esphome

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: ${mqtt_topic_prefix}
  birth_message:
    topic: ${mqtt_topic_prefix}/status
    payload: "online"
    retain: true

one_wire:
  - platform: gpio
    pin: GPIO0

sensor:
  - platform: dallas_temp
    index: 0
    name: temperature0
    update_interval: 10s
  - platform: dallas_temp
    index: 1
    name: temperature1
    update_interval: 10s
  - platform: dallas_temp
    index: 2
    name: temperature2
    update_interval: 10s
  - platform: dallas_temp
    index: 3
    name: temperature3
    update_interval: 10s
  - platform: dallas_temp
    index: 4
    name: temperature4
    update_interval: 10s
