substitutions:
  device_name: solar-sensor

  # TESTING
  sleep_duration: "0s"
  update_interval: "10s"
  log_level: "DEBUG"
  uart_speed: "115200"
  enable_sleep: "false"

  # PRODUCTION
  # sleep_duration: "10min"
  # update_interval: "never"
  # log_level: "NONE"
  # uart_speed: "0"
  # enable_sleep: "true"

esphome:
  name: ${device_name}

esp32:
  variant: esp32c6
  partitions: partitions_zb.csv
  framework:
    type: esp-idf

#deep_sleep:
#  id: deep_sleep_1
#  run_duration: 20s
#  sleep_duration: ${sleep_duration}

logger:
  level: ${log_level}
  baud_rate: ${uart_speed}

external_components:
  - source: github://luar123/zigbee_esphome
    components: [zigbee]

zigbee:
  id: zigbee_solar
  components: all
  on_join:
    then:
      - logger.log: "Zigbee connected"

sensor:
  - platform: adc
    pin: GPIO3
    id: solar_volt
    name: "Solar Voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: ${update_interval}
    attenuation: 12dB
    
    filters:
      - multiply: 5.0
      - lambda: "return x < 0.25 ? 0.0 : x;"
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
          
    on_value:
      then:
        - zigbee.report: zigbee_solar
#        - lambda: |-
#            if (${enable_sleep}) {
#              id(deep_sleep_1).begin_sleep();
#            }
