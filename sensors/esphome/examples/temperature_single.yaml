substitutions:
  device_name: temperature-single
  wifi_fallback_name: "temperature-single Hotspot"
  wifi_fallback_password: "kProm2iSDJDm"
  static_ip: 10.0.10.21
  gateway_ip: 10.0.10.1
  mqtt_broker: 10.0.10.12
  subnet: 255.255.255.0
  mqtt_topic_prefix: temperature-single

esphome:
  name: ${device_name}

esp8266:
  board: esp01_1m

# Enable logging
logger:

api:
  encryption:
    key: !secret temperature-single-key
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${wifi_fallback_name}
    password: ${wifi_fallback_password}

captive_portal:

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  log_topic:
    topic: "${mqtt_topic_prefix}/debug"
    level: WARN

sensor:
  - platform: dht
    pin: 0
    temperature:
      id: "temp_sensor"
      name: "Temperature ESP-01S" # for Home Assistant
    humidity:
      id: "humidity_sensor"
      name: "Humidity ESP-01S" # for Home Assistant
    update_interval: 10s

interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: ${mqtt_topic_prefix}/data
          payload: |-
            root["temperature"] = id(temp_sensor).state;
            root["humidity"] = id(humidity_sensor).state;
