substitutions:
  device_name: blank-sensor
  wifi_fallback_name: "blank-sensor Hotspot"
  wifi_fallback_password: "kProm2iSDJDm"
  static_ip: 10.0.10.20
  gateway_ip: 10.0.10.1
  subnet: 255.255.255.0

esphome:
  name: ${device_name}

#esp8266:
#  board: esp01_1m

esp32:
  variant: esp32c6

# Enable logging
logger:

api:
  encryption:
    key: !secret blank-sensor-key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${wifi_fallback_name}
    password: ${wifi_fallback_password}

captive_portal:
