substitutions:
  device_name: solar-sensor
  wifi_fallback_name: "solar-sensor Hotspot"
  wifi_fallback_password: "kProm2iSDJDm"
  static_ip: 10.0.0.42
  gateway_ip: 10.0.0.138
  subnet: 255.255.255.0
  mqtt_broker: 10.0.0.131
  mqtt_topic_prefix: solar-sensor

esphome:
  name: ${device_name}

esp32:
  variant: esp32c6
  partitions: partitions_zb.csv

#deep_sleep:
#  id: deep_sleep_1
#  run_duration: 15s
#  sleep_duration: 10min

logger:

api:
  encryption:
    key: !secret solar-sensor-key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet}
  ap:
    ssid: ${wifi_fallback_name}
    password: ${wifi_fallback_password}

captive_portal:

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: ${mqtt_topic_prefix}
  birth_message:
    topic: ${mqtt_topic_prefix}/status
    payload: "online"
    retain: true
#  on_connect:
#    then:
#      - delay: 2s
#      - deep_sleep.enter: deep_sleep_1

sensor:
  - platform: adc
    pin: GPIO3  # one of the ADC pins (GPIO0-GPIO6)
    name: "Solar Voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 10s # never
    attenuation: 12dB
    filters:
      - multiply: 5.0 # voltage splitter 30k/7k5
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
