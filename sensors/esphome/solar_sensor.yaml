esphome:
  name: solar-sensor

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  partitions: partitions_zb.csv
  framework:
    type: esp-idf

#deep_sleep:
#  id: deep_sleep_1
#  run_duration: 15s
#  sleep_duration: 10min

logger:

api:
  encryption:
    key: "ok3gPgijyEt166tphwGEmV94rluTKO/U9jTinvZxf0o="
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.0.42
    gateway: 10.0.0.138
    subnet: 255.255.255.0
  ap:
    ssid: "solar hotspot"
    password: "kProm2iSDJDm"

captive_portal:

mqtt:
  broker: 10.0.0.131
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: solar-sensor
  birth_message:
    topic: solar-sensor/status
    payload: "online"
    retain: true
#  on_connect:
#    then:
#      - delay: 2s
#      - deep_sleep.enter: deep_sleep_1

sensor:
  - platform: adc
    pin: GPIO3  # one of the ADC pins (GPIO0-GPIO6)
    name: "Solar Voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 10s # never
    attenuation: 12dB
    filters:
      - multiply: 5.0 # voltage splitter 30k/7k5
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
