esphome:
  name: temperature-single

esp8266:
  board: esp01_1m

# Enable logging
logger:

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.10.21
    gateway: 10.0.10.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "temperature-single Hotspot"
    password: "kProm2iSDJDm"

captive_portal:

mqtt:
  broker: 10.0.10.12
  log_topic:
    topic: "temperature-single/debug"
    level: WARN

sensor:
  - platform: dht
    pin: 0
    temperature:
      id: "temp_sensor"
    humidity:
      id: "humidity_sensor"
    update_interval: 10s

interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: temperature-single/data
          payload: |-
            root["temperature"] = id(temp_sensor).state;
            root["humidity"] = id(humidity_sensor).state;
