---
- name: Setup OS
  hosts: servers
  tags: setup
  become: yes
  tasks:
    - name: Set up paswordless sudo for ansible user
      copy:
        dest: /etc/sudoers.d/ansible
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Install avahi-daemon for mDNS support
      apt:
        name: avahi-daemon
        state: present
        update_cache: yes

    - name: Enable and start avahi-daemon
      systemd:
        name: avahi-daemon
        state: started
        enabled: yes

    - name: Install required packages
      apt:
        name:
          - rsync
          - python3-pygments
        state: present
        update_cache: yes

    - name: Get service facts
      service_facts:

    - name: Set up systemd-resolve to release port 53 for dnsmasq
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'
        state: present
      when: "'systemd-resolved.service' in ansible_facts.services"
      notify: Restart systemd-resolved

    - name: Update resolv.conf symlink
      file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      when: "'systemd-resolved.service' in ansible_facts.services"

    - name: Add local hostname resolution
      lineinfile:
        dest: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ ansible_hostname }}"
        state: present

  handlers:
    - name: Restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted

- name: Install Docker
  tags: install
  hosts: servers
  become: yes
  tasks:
    - name: Check if OS is Debian or Ubuntu
      set_fact:
        os: "{{ ansible_facts['distribution'] | lower }}"
      when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

    - name: Detected OS
      debug:
        msg: "OS detected: {{ os }}"

    - name: Install ca-certificates and curl
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: yes

    - name: Create directory for apt keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/{{ os }}/gpg
        dest: /etc/apt/keyrings/docker.asc

    - name: Set permissions for Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Determine system architecture
      command: "dpkg --print-architecture"
      register: architecture
      changed_when: false

    - name: Include OS release information
      shell: "cat /etc/os-release"
      register: os_release_raw
      changed_when: false

    - name: Generate Docker repository entry
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ os }} $(grep VERSION_CODENAME /etc/os-release | cut -d= -f2) stable" > /etc/apt/sources.list.d/docker.list
      when: os_release_raw.stdout is defined

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Restart Docker service
      systemd:
        name: docker
        state: restarted
        daemon_reload: true

- name: Run Docker compose
  hosts: servers
  tags: run
  become: yes
  vars_files:
    - vault.yaml
  tasks:
    - name: Copy docker folder to server
      synchronize:
        src: ../docker/
        dest: /home/{{ ansible_user }}/docker/

    # Zigbee adapter configuration tasks
    - name: Find Zigbee adapter
      find:
        paths: /dev/serial/by-id/
        file_type: link
      register: found_zigbee_devices

    - name: Set adapter ID fact
      set_fact:
        adapter_id: "{{ found_zigbee_devices.files[0].path | basename if found_zigbee_devices.matched > 0 else '' }}"

    - name: Fail if adapter was not found
      fail:
        msg: "No Zigbee adapter found in /dev/serial/by-id/. Please connect a compatible Zigbee USB adapter."
      when: adapter_id is not defined or adapter_id == ''

    - name: Set adapter type fact
      set_fact:
        # Adapter type ZiGate is not maintained by Zigbee2MQTT!
        # Adapter type ZBOSS is an experimental feature of Zigbee2MQTT!
        adapter_type: >-
          {% if zigbee_usb_adapter_override is defined and zigbee_usb_adapter_override != '' %}
            {{ zigbee_usb_adapter_override }}
          {% elif adapter_id is search('zstack|texas.instruments', ignorecase=True) %}
            zstack
          {% elif adapter_id is search('ember|silicon.labs', ignorecase=True) %}
            ember
          {% elif adapter_id is search('deconz|dresden.elektronik', ignorecase=True) %}
            deconz
          {% elif adapter_id is search('zigate', ignorecase=True) %}
            zigate
          {% elif adapter_id is search('zboss|nordic.semiconductor', ignorecase=True) %}
            zboss
          {% else %}
            unknown
          {% endif %}
      when: zigbee2mqtt_autodetect | bool == false

    - name: Fail if adapter type is unknown
      fail:
        msg: "Unknown Zigbee adapter type detected for device {{ adapter_id }}. Please specify the adapter type using the zigbee_usb_adapter_override variable."
      when: zigbee2mqtt_autodetect | bool == false and adapter_type == 'unknown'

    - name: Print Zigbee adapter name
      debug:
        msg: "Zigbee adapter detected: {{ adapter_id }} (type: {{ adapter_type | default('auto-detected') }})"

    - name: Check if zigbee2mqtt configuration file exists
      stat:
        path: /home/{{ ansible_user }}/docker/zigbee2mqtt/configuration.yaml
      register: zigbee2mqtt_config_stat

    - name: Fill zigbee2mqtt configuration template
      template:
        src: ../docker/zigbee2mqtt/configuration.yaml.j2
        dest: /home/{{ ansible_user }}/docker/zigbee2mqtt/configuration.yaml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      when: zigbee2mqtt_config_stat.stat.exists == false or zigbee2mqtt_reset | default(false) | bool

    - name: Stop zigbee2mqtt container if running to reset state
      community.docker.docker_compose_v2:
        project_src: /home/{{ ansible_user }}/docker/
        state: absent
        services:
          - zigbee2mqtt
      when: zigbee2mqtt_reset | default(false) | bool

    - name: Remove coordinator backup to reset zigbee2mqtt state
      file:
        path: /home/{{ ansible_user }}/docker/zigbee2mqtt/coordinator_backup.json
        state: absent
      when: zigbee2mqtt_reset | default(false) | bool

    # NGINX reverse proxy configuration tasks
    - name: Fill NGINX reverse proxy configuration template
      template:
        src: ../docker/nginx/conf.d/default.conf.j2
        dest: /home/{{ ansible_user }}/docker/nginx/conf.d/default.conf
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Fill NGINX reverse proxy HTML template
      template:
        src: ../docker/nginx/html/index.html.j2
        dest: /home/{{ ansible_user }}/docker/nginx/html/index.html
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create Netbird setup key
      netbird_create_setup_key:
        api_key: "{{ vault_netbird_token }}"
        name_prefix: "{{ inventory_hostname }}"
        type: "one-off"
      register: netbird_setup_key

    - name: Create .env file for Docker compose
      template:
        src: ../docker/template.env.j2
        dest: /home/{{ ansible_user }}/docker/.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Set fact for local IP
      set_fact:
        local_ip: "{{ ansible_default_ipv4.address }}"

    - name: Run Docker Compose (except dnsmasq)
      community.docker.docker_compose_v2:
        project_src: /home/{{ ansible_user }}/docker/
        state: present
        services:
          - prometheus
          - grafana
          - mosquitto
          - mqtt-exporter
          - node-exporter
          - netbird-client
          - zigbee2mqtt
          - homeassistant
          - nginx-reverse-proxy
          - esphome
      register: output

    - name: Show results
      debug:
        var: output

    # DNS setup

    - name: Wait for Netbird IP
      shell: "ip -4 addr show wt0 | awk '/inet / {print $2}' | cut -d/ -f1"
      register: netbird_ip_result
      retries: 10
      delay: 6
      until: netbird_ip_result.stdout != ""
      changed_when: false

    - name: Set fact for Netbird IP
      set_fact:
        netbird_ip: "{{ netbird_ip_result.stdout }}"

    - name: Add dnsmasq configuration for Netbird IP
      template:
        src: ../docker/dnsmasq-netbird/dnsmasq.conf.j2
        dest: /home/{{ ansible_user }}/docker/dnsmasq-netbird/dnsmasq.conf
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Run dnsmasq-netbird container
      community.docker.docker_compose_v2:
        project_src: /home/{{ ansible_user }}/docker/
        state: present
        services:
          - dnsmasq-netbird
      register: dnsmasq_netbird_output

    - name: Show dnsmasq-netbird results
      debug:
        var: dnsmasq_netbird_output

    - name: Add dnsmasq configuration for local network
      template:
        src: ../docker/dnsmasq-local/dnsmasq.conf.j2
        dest: /home/{{ ansible_user }}/docker/dnsmasq-local/dnsmasq.conf
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Run dnsmasq-local container
      community.docker.docker_compose_v2:
        project_src: /home/{{ ansible_user }}/docker/
        state: present
        services:
          - dnsmasq-local
      register: dnsmasq_local_output

    - name: Show dnsmasq-local results
      debug:
        var: dnsmasq_local_output

- name: Set up Netbird DNS
  hosts: servers
  tags: netbird
  become: no
  vars_files:
    - vault.yaml
  tasks:
    - name: Wait for Netbird IP
      shell: "ip -4 addr show wt0 | awk '/inet / {print $2}' | cut -d/ -f1"
      register: netbird_ip_result
      retries: 10
      delay: 6
      until: netbird_ip_result.stdout != ""
      changed_when: false

    - name: Set fact for Netbird IP
      set_fact:
        netbird_ip: "{{ netbird_ip_result.stdout }}"

    - name: Add nameserver
      netbird_add_nameserver_group:
        api_key: "{{ vault_netbird_token }}"
        name: "{{ inventory_hostname }} dnsmasq"
        description: "Nameserver group added by Ansible playbook via Netbird API for dnsmasq running on {{ inventory_hostname }}"
        nameservers:
          - ip: "{{ netbird_ip }}"
            port: 5053
        groups:
          - "All"
