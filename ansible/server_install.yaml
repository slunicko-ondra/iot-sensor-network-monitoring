---
- name: Install Docker
  tags: install
  hosts: server
  become: yes
  tasks:
    - name: Check if OS is Debian or Ubuntu
      set_fact:
        os: "{{ ansible_facts['distribution'] | lower }}"
      when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

    - name: Detected OS
      debug:
        msg: "OS detected: {{ os }}"

    - name: Install ca-certificates and curl
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: yes

    - name: Create directory for apt keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/{{ os }}/gpg
        dest: /etc/apt/keyrings/docker.asc

    - name: Set permissions for Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Determine system architecture
      command: "dpkg --print-architecture"
      register: architecture

    - name: Include OS release information
      shell: "cat /etc/os-release"
      register: os_release_raw

    - name: Generate Docker repository entry
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ os }} $(grep VERSION_CODENAME /etc/os-release | cut -d= -f2) stable" > /etc/apt/sources.list.d/docker.list
      when: os_release_raw.stdout is defined

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Restart Docker service
      systemd:
        name: docker
        state: restarted
        daemon_reload: true

- name: Run Docker compose
  hosts: server
  tags: run
  become: yes
  tasks:
    - name: Copy docker folder to server
      copy:
        src: ../docker/
        dest: /home/{{ ansible_user }}/docker/
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        directory_mode: '0755'
        mode: '0644'
    - name: Run Docker Compose
      community.docker.docker_compose_v2:
        project_src: /home/{{ ansible_user }}/docker/
        state: present
      register: output

    - name: Show results
      ansible.builtin.debug:
        var: output