---
- name: Prepare ESPHome firmware
  hosts: sensors
  become: no
  vars_files:
    - vault.yaml
  roles:
    - role: prepare_esphome_configs
      tags: configs
    - role: prepare_esphome_secrets
      tags: secrets
    - role: esphome_firmware
      tags: firmware

- name: Upload ESPHome configs to server
  hosts: servers
  become: yes
  roles:
    - role: upload_esphome_configs
      tags: upload

- name: Flash ESPHome devices via USB
  hosts: sensors
  become: no
  serial: 1
  roles:
    - role: esphome_flash
      tags: flash
