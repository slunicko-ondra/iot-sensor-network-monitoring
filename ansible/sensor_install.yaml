---
- name: Test ESPHome modules
  hosts: sensors
  tags: test
  gather_facts: false
  collections:
    - local.esphome_api
  tasks:
    - name: Set up virtual environment
      pip:
        name:
          - aioesphomeapi
          - esphome
        virtualenv: "{{ playbook_dir }}/venv"
        virtualenv_command: "{{ ansible_playbook_python }} -m venv"
    - name: Set Python interpreter to virtual environment
      set_fact:
        ansible_python_interpreter: "{{ playbook_dir }}/venv/bin/python"
    - name: Get facts
      esphome_device_facts:
        host: "{{ inventory_hostname }}"
        noise_psk: "{{ esphome_key }}"
      register: device_facts
    - name: Debug device facts
      debug:
        var: device_facts
    - name: Install firmware to device
      esphome_run:
        host: "{{ inventory_hostname }}"
        config_path: "{{ playbook_dir }}/../sensors/esphome/{{ config_name }}.yaml"
