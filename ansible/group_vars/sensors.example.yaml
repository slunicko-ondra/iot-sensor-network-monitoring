# Wi-Fi and MQTT credentials are stored in `vault.yaml` and used to generate the ESPHome secrets file.

# Gateway and subnet for the sensor network.
default_gateway: <IP_ADDRESS> # for example 10.0.10.1
default_subnet: <IP_ADDRESS>  # for example 255.255.255.0

# MQTT broker address for the sensor network.
mqtt_broker: <IP_ADDRESS> # for example 10.0.10.12

# Connection type for Ansible.
# Since sensors are typically built and configured locally, we use the local connection type.
# This means that Ansible will execute tasks directly on the local machine where the playbook is run,
# rather than connecting to remote hosts via SSH or other methods.
ansible_connection: local

# Disable fact gathering for sensors, as it would not work with ESP devices and is not necessary for our use case.
ansible_gather_facts: false
