ansible_user: "<server_user>"

# Your timezone used in containers like Home Assistant, Zigbee2MQTT, etc.
timezone: Europe/Prague

# Zigbee2MQTT has an autodetect feature that can automatically detect the Zigbee USB adapter.
# true: Zigbee2MQTT will try to automatically detect the Zigbee USB adapter.
# false: Ansible will try to automatically detect the Zigbee USB adapter.
#        Or you can specify the adapter manually using zigbee_usb_adapter_override.
zigbee2mqtt_autodetect: false

# If autodetect is disabled, you can specify the Zigbee USB adapter manually.
# values: zstack, ember, deconz, zigate, zboss
# Adapter type ZiGate is not maintained by Zigbee2MQTT!
# Adapter type ZBOSS is an experimental feature of Zigbee2MQTT!
# For more details see: https://www.zigbee2mqtt.io/guide/configuration/adapter-settings.html#basic-configuration
zigbee_usb_adapter_override: zstack

# If you need to bypass automatic device discovery, specify the full absolute path to the Zigbee USB adapter.
# This is useful for custom mappings, systems with multiple adapters, or testing without physical hardware.
# values: absolute device paths (e.g., /dev/serial/by-id/usb-..., /dev/ttyUSB0) or /dev/null for testing.
# Note: If left empty ("") or not defined, the playbook will attempt to auto-detect the device in /dev/serial/by-id/.
zigbee_usb_device_path_override: ""

# Resets Zigbee2MQTT configuration on every playbook run.
zigbee2mqtt_reset: false

# Set up domain name, which will be used for Netbird and local DNS configuration.
# It can be any domain name because it's only used for local network (and Netbird) and won't be accessible from the internet.
# Different services are available under different subdomains, for example: grafana.my-domain.internal, etc.
domain_name: my-domain.internal

# Base directory for IoT stack Docker containers configuration and data.
iot_base_dir: /srv/iot_stack/docker

# Image versions for Docker containers
# If a variable is not set or is empty, the latest version of the image will be used.
# prometheus_version: "<tag>"
# grafana_version: "<tag>"
# mosquitto_version: "<tag>"
# mqtt_exporter_version: "<tag>"
# node_exporter_version: "<tag>"
# netbird_client_version: "<tag>"
# zigbee2mqtt_version: "<tag>"
# home_assistant_version: "<tag>"
# nginx_version: "<tag>"
# esphome_version: "<tag>"
# dnsmasq_version: "<tag>"
