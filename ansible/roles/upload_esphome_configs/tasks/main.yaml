---
# roles/upload_esphome_configs/tasks/main.yaml
- name: Ensure ESPHome directory exists
  file:
    path: "{{ iot_base_dir }}/esphome/config"
    state: directory
    mode: '0755'

- name: Upload ESPHome YAML files directly
  copy:
    src: "{{ item }}"
    dest: "{{ iot_base_dir }}/esphome/config/"
  with_fileglob:
    - "{{ esphome_output_dir }}/*.yaml"

- name: Verify uploaded files
  find:
    paths: "{{ iot_base_dir }}/esphome/config"
    patterns: "*.yaml"
  register: uploaded_files

- name: Display uploaded ESPHome files
  debug:
    msg: "Uploaded {{ uploaded_files.matched }} YAML files to {{ iot_base_dir }}/esphome/config"
  run_once: true
