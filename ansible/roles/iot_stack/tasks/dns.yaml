---
# roles/iot_stack/tasks/dns.yaml
- name: Add dnsmasq configuration for Netbird IP
  template:
    src: ../docker/dnsmasq-netbird/dnsmasq.conf.j2
    dest: "{{ iot_base_dir }}/dnsmasq-netbird/dnsmasq.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart docker compose

- name: Run dnsmasq-netbird container
  community.docker.docker_compose_v2:
    project_src: "{{ iot_base_dir }}/"
    state: present
    services:
      - dnsmasq-netbird

- name: Add dnsmasq configuration for local network
  template:
    src: ../docker/dnsmasq-local/dnsmasq.conf.j2
    dest: "{{ iot_base_dir }}/dnsmasq-local/dnsmasq.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart docker compose

- name: Run dnsmasq-local container
  community.docker.docker_compose_v2:
    project_src: "{{ iot_base_dir }}/"
    state: present
    services:
      - dnsmasq-local
