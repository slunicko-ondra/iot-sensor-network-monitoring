services:

  prometheus:
    image: "prom/prometheus:${PROMETHEUS_VERSION:-latest}"
    container_name: prometheus
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-0}'

  grafana:
    image: "grafana/grafana:${GRAFANA_VERSION:-latest}"
    container_name: grafana
    restart: always
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  mosquitto:
    image: "eclipse-mosquitto:${MOSQUITTO_VERSION:-latest}"
    container_name: mosquitto
    restart: always
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/logs

  mqtt-exporter:
    image: "kpetrem/mqtt-exporter:${MQTT_EXPORTER_VERSION:-latest}"
    container_name: mqtt-exporter
    depends_on:
      - mosquitto
    restart: always
    ports:
      - '9000:9000'
    environment:
      - MQTT_ADDRESS=mosquitto
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_IGNORED_TOPICS=zigbee2mqtt/bridge/*,zigbee2mqtt/config/*,zigbee2mqtt/clusters/*

  node-exporter:
    image: "quay.io/prometheus/node-exporter:${NODE_EXPORTER_VERSION:-latest}"
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: "host"
    pid: "host"
    restart: always
    volumes:
      - '/:/host:ro,rslave'
      - '/run/udev:/run/udev:ro'

  netbird-client:
    image: "netbirdio/netbird:${NETBIRD_CLIENT_VERSION:-latest}"
    container_name: netbird-client
    hostname: ${NB_HOSTNAME}
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: "host"
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
    volumes:
      - netbird-client:/var/lib/netbird

  zigbee2mqtt:
    image: "ghcr.io/koenkk/zigbee2mqtt:${ZIGBEE2MQTT_VERSION:-latest}"
    container_name: zigbee2mqtt
    depends_on:
      - mosquitto
    restart: always
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # Frontend port
      - "8080:8080"
    environment:
      - TZ=${TZ}
    devices:
      - ${ZIGBEE_USB_DEVICE}:/dev/ttyACM0

  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:${HOME_ASSISTANT_VERSION:-stable}"
    container_name: homeassistant-docker
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: always
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ}

  nginx-reverse-proxy:
    image: "nginx:${NGINX_VERSION:-latest}"
    container_name: nginx-reverse-proxy
    restart: always
    ports:
      - '80:80'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro

  esphome:
    image: "ghcr.io/esphome/esphome:${ESPHOME_VERSION:-latest}"
    container_name: esphome
    volumes:
      - ./esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: always
    privileged: true
    network_mode: host
    environment:
      - USERNAME=${ESPHOME_USERNAME}
      - PASSWORD=${ESPHOME_PASSWORD}

  dnsmasq-netbird:
    image: "dockurr/dnsmasq:${DNSMASQ_VERSION:-latest}"
    container_name: dnsmasq-netbird
    ports:
      - "5053:53/udp"
      - "5053:53/tcp"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq-netbird/dnsmasq.conf:/etc/dnsmasq.conf:ro
    restart: always

  dnsmasq-local:
    image: "dockurr/dnsmasq:${DNSMASQ_VERSION:-latest}"
    container_name: dnsmasq-local
    ports:
      - "${LOCAL_IP}:53:53/udp"
      - "${LOCAL_IP}:53:53/tcp"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq-local/dnsmasq.conf:/etc/dnsmasq.conf:ro
    restart: always


volumes:
  prometheus-data:
  grafana-data:
  mosquitto-data:
  mosquitto-logs:
  netbird-client:
