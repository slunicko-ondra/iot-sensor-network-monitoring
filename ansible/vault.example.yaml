# This is a file for sensitive data used by Ansible.
# Create this file using the command: `ansible-vault create vault.yaml` with the following content:

# Access token used by Ansible to authenticate with Netbird API and manage the Netbird configuration.
# Create a token in Netbird dashboard (https://app.netbird.io/) > Team > Users > You > Access Tokens.
vault_netbird_token:

# Default password for Grafana admin user. You can change it after the first login in Grafana UI.
vault_grafana_admin_password:

# Password for ESPHome.
vault_esphome_password:

# Wi-Fi credentials shared by all ESPHome devices.
vault_wifi_ssid:
vault_wifi_password:

# MQTT credentials shared by Mosquitto and all MQTT clients.
# Use a dedicated non-admin user and a strong random password.
vault_mqtt_username:
vault_mqtt_password:

# Home Assistant long-lived access token used by Prometheus to scrape /api/prometheus.
# You can create it in Home Assistant: Profile -> Create Token.
ha_bearer_token:

# Password for the fallback Wi-Fi hotspot that ESPHome devices will create if they cannot connect to the main Wi-Fi network.
vault_hotspot_password:
