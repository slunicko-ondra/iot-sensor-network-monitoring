---
- name: Backup Docker infrastructure (volumes and bind mounts)
  hosts: servers
  become: yes
  vars:
    remote_tmp_dir: "/tmp/docker_backup_temp"
    local_backup_dir: "./backups"
    docker_volumes:
      - docker_prometheus-data
      - docker_grafana-data
      - docker_mosquitto-data
      - docker_mosquitto-logs
      - docker_netbird-client

  tasks:
    - name: Get current date and time via Ansible setup
      setup:
        filter: "ansible_date_time"

    - name: Set backup filename
      set_fact:
        backup_filename: "docker_backup_{{ inventory_hostname }}_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.tar.gz"

    - name: Set master backup file path
      set_fact:
        master_backup_file: "/tmp/{{ backup_filename }}"

    - name: Print backup information
      debug:
        msg:
          - "Creating backup: {{ backup_filename }}"
          - "Docker base directory: {{ iot_base_dir }}"
          - "Named volumes: {{ docker_volumes | join(', ') }}"

    - name: Prepare clean temporary directory on remote server
      file:
        path: "{{ remote_tmp_dir }}"
        state: "{{ item }}"
      loop:
        - absent
        - directory

    - block:
        - name: Stop Docker containers for data consistency
          community.docker.docker_compose_v2:
            project_src: "{{ iot_base_dir }}"
            state: stopped

        - name: Backup named volumes via Docker CLI (Busybox)
          command: >
            docker run --rm
            -v {{ item }}:/volume_data
            -v {{ remote_tmp_dir }}:/backup
            busybox tar czf /backup/{{ item }}.tar.gz -C /volume_data .
          loop: "{{ docker_volumes }}"
          changed_when: true

        - name: Stage Docker bind mounts (configs) for archiving
          copy:
            src: "{{ iot_base_dir }}"
            dest: "{{ remote_tmp_dir }}/configs"
            remote_src: yes

        - name: Create final archive using Ansible archive module
          archive:
            path: "{{ remote_tmp_dir }}/*"
            dest: "{{ master_backup_file }}"
            format: gz

      always:
        - name: Start Docker containers again (ALWAYS RUNS)
          community.docker.docker_compose_v2:
            project_src: "{{ iot_base_dir }}"
            state: present

    - name: Ensure local backup directory exists
      file:
        path: "{{ local_backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Download master backup to local machine
      fetch:
        src: "{{ master_backup_file }}"
        dest: "{{ local_backup_dir }}/"
        flat: yes

    - name: Clean up temporary files on remote server
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ remote_tmp_dir }}"
        - "{{ master_backup_file }}"

    - name: Print final summary
      debug:
        msg:
          - "Backup process completed successfully!"
          - "Location: {{ local_backup_dir }}/{{ backup_filename }}"
