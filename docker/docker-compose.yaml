services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    network_mode: "host"
#    ports:
#      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    network_mode: "host"
#    ports:
#      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ChangeMe123  # TODO
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    network_mode: "host"
#    ports:
#      - '1883:1883'
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/logs

  mqtt-exporter:
    image: kpetrem/mqtt-exporter:latest
    container_name: mqtt-exporter
    restart: unless-stopped
    network_mode: "host"
#    ports:
#      - '9000:9000'
    environment:
      - MQTT_ADDRESS=127.0.0.1

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    network_mode: "host"
    pid: "host"
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  netbird-client:
    container_name: netbird-client
    hostname: ${NB_HOSTNAME}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: host
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
    volumes:
      - netbird-client:/var/lib/netbird
    image: netbirdio/netbird:latest

volumes:
  prometheus-data:
  grafana-data:
  mosquitto-data:
  mosquitto-logs:
  netbird-client:
